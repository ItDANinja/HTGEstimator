[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htg-estimator"
version = "0.1.0"
description = "Construction estimating assistant implementing HTG Pro Services rules"
authors = [
  {name = "HTG Pro Services"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0"
]

[project.optional-dependencies]
development = [
  "pytest>=7.4"
]

[project.scripts]
htg-estimator = "htg_estimator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

